<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GC／DCシグナル検索</title><link rel="stylesheet" href="./styles.css"></head><body data-signal-source="./signals.json"><main class="gc-shell"><header class="gc-header"><h1>GC／DCシグナル検索</h1><p>最新の自動銘柄診断に記録されたシグナルを確認します。売買推奨ではありません。</p><a href="../">公開用投資情報へ戻る</a></header><section id="freshness" class="freshness" aria-live="polite">データ状態を確認しています…</section><section class="controls" aria-label="検索条件"><label>銘柄コード（任意）<input id="ticker" inputmode="text" maxlength="4" autocomplete="off" placeholder="例: 2323"></label><label>シグナル<select id="cross"><option value="ALL">すべて</option><option value="GC">GC</option><option value="DC">DC</option></select></label><button id="search" type="button">検索</button></section><p id="result-note" class="result-note" aria-live="polite"></p><div class="table-wrap"><table><thead><tr><th>銘柄コード</th><th>銘柄名</th><th>シグナル</th><th>データ日</th><th>チャート</th></tr></thead><tbody id="results"><tr><td colspan="5">読み込み中…</td></tr></tbody></table></div><p class="footnote">対象は自動銘柄診断の対象銘柄です。全上場銘柄を網羅する一覧ではありません。チャートはTradingViewで開きます。</p></main><script src="./gc-signals.js" defer></script></body></html>
